<svg xmlns="http://www.w3.org/2000/svg" width="840" height="236" viewBox="0 0 840 236" role="img" aria-label="Trajetória: SENAI Barueri, Paynet, Revizia, Be.Aliant e Estácio">
<title>Trajetória: SENAI Barueri, Paynet, Revizia, Be.Aliant e Estácio</title>
<style>
  .sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .in{opacity:0;animation:fadeUp .7s ease-out forwards}
  
  @keyframes draw{to{stroke-dashoffset:0}}
  .prog{stroke-dasharray:456;stroke-dashoffset:456;animation:draw 2.2s .3s ease-out forwards}
  @keyframes ring{0%{r:7;opacity:.8}100%{r:20;opacity:0}}
  .ring{animation:ring 1.8s ease-out infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="0.5" y="0.5" width="839" height="235" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="44" class="mono" font-size="13" fill="#1a7f37">// <tspan fill="#1f2328" font-weight="600">trajetória</tspan></text>
<line x1="116" y1="104" x2="724" y2="104" stroke="#d8dee4" stroke-width="2" stroke-dasharray="2 5"/>
<line class="prog" x1="116" y1="104" x2="572" y2="104" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/>
<g class="in" style="animation-delay:0.30s">
  <text x="116" y="80" text-anchor="middle" class="mono" font-size="12" fill="#1a7f37">2023</text>
  <circle cx="116" cy="104" r="7" fill="#1a7f37"/>
  <text x="116" y="140" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#1f2328">SENAI Barueri</text>
  <text x="116" y="162" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Curso de Web Front-End</text><text x="116" y="180" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">onde tudo começou, aos 18</text>
</g><g class="in" style="animation-delay:0.65s">
  <text x="268" y="80" text-anchor="middle" class="mono" font-size="12" fill="#1a7f37">set/2023</text>
  <circle cx="268" cy="104" r="7" fill="#1a7f37"/>
  <text x="268" y="140" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#1f2328">Paynet</text>
  <text x="268" y="162" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Front-End &amp;</text><text x="268" y="180" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">UX Designer</text>
</g><g class="in" style="animation-delay:1.00s">
  <text x="420" y="80" text-anchor="middle" class="mono" font-size="12" fill="#1a7f37">ago/2024</text>
  <circle cx="420" cy="104" r="7" fill="#1a7f37"/>
  <text x="420" y="140" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#1f2328">Revizia</text>
  <text x="420" y="162" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Estágio Front-End</text><text x="420" y="180" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Angular + TypeScript</text>
</g><g class="in" style="animation-delay:1.35s">
  <text x="572" y="80" text-anchor="middle" class="mono" font-size="12" fill="#1a7f37">fev/2026 → hoje</text>
  <circle cx="572" cy="104" r="7" fill="#1a7f37"/><circle class="ring" cx="572" cy="104" r="7" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <text x="572" y="140" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#1f2328">Be.Aliant</text>
  <text x="572" y="162" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Dev Front-End Jr</text><text x="572" y="180" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">web para clientes</text>
</g><g class="in" style="animation-delay:1.70s">
  <text x="724" y="80" text-anchor="middle" class="mono" font-size="12" fill="#59636e">dez/2026</text>
  <circle cx="724" cy="104" r="6.5" fill="#ffffff" stroke="#59636e" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="724" y="140" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#1f2328">Estácio</text>
  <text x="724" y="162" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Tecnólogo em</text><text x="724" y="180" text-anchor="middle" class="sans" font-size="12.5" fill="#59636e">Sistemas para Internet</text>
