<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Gabriel Correia Reis — Desenvolvedor Front-End">
<title>Gabriel Correia Reis — Desenvolvedor Front-End</title>
<style>
  .sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .in{opacity:0;animation:fadeUp .7s ease-out forwards}
  
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .cell{animation:pulse 3.2s ease-in-out infinite}
  @keyframes role{0%{opacity:0;transform:translateY(6px)}4%,30%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-6px)}}
  .role{opacity:0;animation:role 9s ease-in-out infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .caret{animation:blink 1s steps(1) infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="0.5" y="0.5" width="839" height="249" rx="16" fill="#0d1117" stroke="#1e2a23"/>

