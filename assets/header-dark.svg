  <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45"><stop offset="0" stop-color="#3fb950" stop-opacity="0.32"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3fb950" stroke-opacity=".06"/></pattern>
